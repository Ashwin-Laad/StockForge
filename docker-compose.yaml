version: '3.8'

services:
  mongo:
    image: mongo:5.0.3
    container_name: mongodb

    restart: always

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ashwin
      MONGO_INITDB_ROOT_PASSWORD: StrongPassword123

    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express
    container_name: mongo-express

    restart: always

    ports:
      - "8081:8081"

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ashwin
      ME_CONFIG_MONGODB_ADMINPASSWORD: StrongPassword123
      ME_CONFIG_MONGODB_URL: mongodb://ashwin:StrongPassword123@mongo:27017/

    depends_on:
      - mongo

volumes:
  mongo-data: